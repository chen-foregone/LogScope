services:
  postgres:
    image: postgres:17-alpine
    container_name: logscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logscope
      POSTGRES_USER: logscope
      POSTGRES_PASSWORD: logscope
    ports:
      - "5432:5432"
    volumes:
      - logscope-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logscope -d logscope"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  logscope-postgres-data:
